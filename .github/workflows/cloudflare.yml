name: Deploy 224 Live House to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-224-live-house
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: venue224_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test_password@localhost:5432/venue224_test
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate deployment access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN in the cloudflare environment'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure CLOUDFLARE_ACCOUNT_ID in the cloudflare environment'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cloudflare
      - name: Create or update separate Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
